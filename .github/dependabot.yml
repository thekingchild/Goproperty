# Keeps the SHA-pinned GitHub Actions current. Composer and npm packages are
# pinned deliberately (docs/PROGRESS.md, P00-01) and are upgraded by hand.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
