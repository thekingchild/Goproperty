# Install drill (INSTALLER.md § 12, P00-06, P01-09): builds the release
# package, installs its split layout twice under shared-host limits
# (max_execution_time=30, exec/proc_open disabled): with `goproperty:install`,
# and by walking the web wizard over HTTP (file-check unlock, batched
# migrations, test email, TOTP enrolment, finish, console handover, live
# cron heartbeat, /install closed). Checks both sites and compares both
# schemas with a plain `migrate`; then the deploy drill
# (P00-13): first install into the releases/shared layout, upgrades and
# refusals. Runs nightly, on pull requests that touch migrations, the
# installer or the deploy scripts, by hand, and before every release.
name: Install drill

on:
  schedule:
    - cron: '30 2 * * *'
  pull_request:
    paths:
      - 'database/migrations/**'
      - 'database/seeders/**'
      - 'app/Installer/**'
      - 'app/Console/Commands/InstallCommand.php'
      - 'app/Http/Controllers/Install/**'
      - 'app/Http/Middleware/Installer/**'
      - 'app/Http/Middleware/EnsureInstallerOpen.php'
      - 'routes/install.php'
      - 'resources/views/installer/**'
      - 'public/install.css'
      - 'scripts/release/**'
      - 'scripts/deploy/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-install-drill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drill:
    name: Install drill (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.0
            image: mysql:8.0
            connection: mysql
            health: mysqladmin ping -h 127.0.0.1 -ppassword
          - name: MySQL 8.4
            image: mysql:8.4
            connection: mysql
            health: mysqladmin ping -h 127.0.0.1 -ppassword
          - name: MariaDB 10.6
            image: mariadb:10.6
            connection: mariadb
            health: healthcheck.sh --connect --innodb_initialized
          - name: MariaDB 11.4
            image: mariadb:11.4
            connection: mariadb
            health: healthcheck.sh --connect --innodb_initialized

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: ${{ matrix.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60 # 2.40.0
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, exif, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, sodium, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Build package
        run: scripts/release/build-package.sh "0.0.0-drill.${GITHUB_RUN_NUMBER}" "$RUNNER_TEMP/dist"

      - name: Install drill
        run: scripts/release/install-drill.sh "$RUNNER_TEMP/dist/goproperty-0.0.0-drill.${GITHUB_RUN_NUMBER}.zip"

      - name: Build deploy archive
        run: scripts/deploy/build-release.sh "$RUNNER_TEMP/release.tar.gz"

      # First install into the deploy layout, upgrade, a failing release, a
      # failed pre-deploy backup and pruning (P00-13, docs/runbooks/shared-hosting.md).
      - name: Deploy drill
        run: scripts/deploy/deploy-drill.sh "$RUNNER_TEMP/release.tar.gz"
