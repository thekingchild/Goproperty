# Install drill (INSTALLER.md § 12, P00-06): builds the release package,
# installs its split layout with `goproperty:install` under shared-host
# limits (max_execution_time=30, exec/proc_open disabled), checks the site,
# and compares the schema with a plain `migrate`. Runs nightly, on pull
# requests that touch migrations or the installer, by hand, and before every
# release (release.yml).
name: Install drill

on:
  schedule:
    - cron: '30 2 * * *'
  pull_request:
    paths:
      - 'database/migrations/**'
      - 'database/seeders/**'
      - 'app/Installer/**'
      - 'app/Console/Commands/InstallCommand.php'
      - 'scripts/release/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-install-drill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drill:
    name: Install drill (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.0
            image: mysql:8.0
            connection: mysql
            health: mysqladmin ping -h 127.0.0.1 -ppassword
          - name: MySQL 8.4
            image: mysql:8.4
            connection: mysql
            health: mysqladmin ping -h 127.0.0.1 -ppassword
          - name: MariaDB 10.6
            image: mariadb:10.6
            connection: mariadb
            health: healthcheck.sh --connect --innodb_initialized
          - name: MariaDB 11.4
            image: mariadb:11.4
            connection: mariadb
            health: healthcheck.sh --connect --innodb_initialized

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: ${{ matrix.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60 # 2.40.0
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, exif, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, sodium, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Build package
        run: scripts/release/build-package.sh "0.0.0-drill.${GITHUB_RUN_NUMBER}" "$RUNNER_TEMP/dist"

      - name: Install drill
        run: scripts/release/install-drill.sh "$RUNNER_TEMP/dist/goproperty-0.0.0-drill.${GITHUB_RUN_NUMBER}.zip"
