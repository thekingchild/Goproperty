# Quality gate: Pint, Larastan and Pest via `composer ci` (AGENT.md § 2),
# once per supported database. cPanel/Plesk hosts often run MariaDB, so both
# engines are tested at their oldest and newest supported LTS versions
# (ARCHITECTURE.md § 2, docs/runbooks/ci.md). The suite runs on the
# shared-hosting profile, including a cron drill with exec/proc_open disabled.
# Gotenberg (headless Chrome over HTTP) runs as a second service so the
# document visual-diff tests compare dompdf with Chrome (BRANDING_DOCUMENTS.md
# § 5); poppler's pdftoppm rasterises the PDFs for them.
# Deploy and Release call this workflow first. A separate job checks that
# artisan and index.php explain an old PHP instead of failing (INSTALLER.md § 2).
name: CI

on:
  # Branches only: version tags run this through the Release workflow.
  push:
    branches: ['**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when Deploy calls this, so a deploy's
# gate never cancels (or is cancelled by) the push run on the same branch.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (${{ matrix.name }})
    runs-on: ubuntu-24.04
    # The full suite takes 15-20 minutes on MySQL (2026-10-28); 35 leaves room
    # to grow while still stopping a hung job.
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.0
            image: mysql:8.0
            connection: mysql
            health: mysqladmin ping -h 127.0.0.1 -ppassword
          - name: MySQL 8.4
            image: mysql:8.4
            connection: mysql
            health: mysqladmin ping -h 127.0.0.1 -ppassword
          - name: MariaDB 10.6
            image: mariadb:10.6
            connection: mariadb
            health: healthcheck.sh --connect --innodb_initialized
          - name: MariaDB 11.4
            image: mariadb:11.4
            connection: mariadb
            health: healthcheck.sh --connect --innodb_initialized

    services:
      database:
        image: ${{ matrix.image }}
        env:
          # The MariaDB image accepts the MYSQL_* names too.
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      # Chrome for the visual-diff tests (tests/Support/PdfVisualDiff.php):
      # the app's chrome PDF driver talks to it at PDF_CHROME_URL.
      gotenberg:
        image: gotenberg/gotenberg:8.37.0-chromium
        ports:
          - 3000:3000
        options: >-
          --health-cmd="curl --silent --fail http://localhost:3000/health"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      HOSTING_PROFILE: shared
      DB_CONNECTION: ${{ matrix.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password
      # Only the visual-diff tests use it; the shared profile keeps dompdf as the driver.
      PDF_CHROME_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60 # 2.40.0
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, exif, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, sodium, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      # pdftoppm and pdftotext for the document visual-diff tests (not on the runner image).
      - name: Install poppler-utils
        run: |
          if ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends poppler-utils
          fi
          pdftoppm -v

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Build assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run quality gate
        run: composer ci

  php-guard:
    name: Old PHP guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The guard runs before Composer, so no vendor/ is needed.
      - name: artisan and index.php explain the PHP version on PHP 7.4 and 8.1
        run: |
          for version in 7.4 8.1; do
            for entry in artisan public/index.php; do
              if output=$(docker run --rm -v "$PWD:/app:ro" -w /app "php:$version-cli" php "$entry" 2>&1); then
                echo "::error::$entry exited 0 on PHP $version"
                exit 1
              fi
              # The image's patch release varies, so match it loosely.
              if ! grep -qE "^GoProperty needs PHP 8\.4\.1 or newer; this server runs ${version//./\\.}\.[0-9]+\.\$" <<< "$output"; then
                echo "::error::$entry on PHP $version printed: $output"
                exit 1
              fi
              echo "PHP $version, $entry: $output"
            done
          done
